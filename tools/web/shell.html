<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spartan Engine (WebGPU)</title>
<style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #ddd; }
    #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #101014; transition: opacity 0.8s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading_title { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: #eee; }
    #loading_track { width: min(420px, 70vw); height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
    #loading_bar { width: 0%; height: 100%; background: #e8e8ec; transition: width 0.3s ease; }
    #loading_step { min-height: 1.2em; font-size: 12px; color: #9a9aa4; text-align: center; max-width: 80vw; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading">
    <div id="loading_title">Spartan Engine</div>
    <div id="loading_track"><div id="loading_bar"></div></div>
    <div id="loading_step">Loading</div>
</div>
<script>
    const loading_element = document.getElementById("loading");
    const bar_element     = document.getElementById("loading_bar");
    const step_element    = document.getElementById("loading_step");

    // the download fills the first part of the bar, the engine's own load steps the rest
    const download_share = 0.7;
    let progress         = 0.0;
    let engine_base      = download_share;
    let engine_step      = "";
    let failed           = false;

    function show(fraction, text)
    {
        progress = Math.max(progress, Math.min(fraction, 1.0));
        bar_element.style.width = (progress * 100.0).toFixed(1) + "%";
        if (text !== undefined)
        {
            step_element.textContent = text;
        }
    }

    function fail(text)
    {
        failed = true;
        show(progress, text);
    }

    // emscripten reports the data download as "Downloading data... (loaded/total)"
    function set_status(text)
    {
        if (failed || !text)
            return;

        const match = text.match(/\((\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)\)/);
        if (match && Number(match[2]) > 0)
        {
            const loaded = Number(match[1]);
            const total  = Number(match[2]);
            show(download_share * loaded / total, "Downloading " + (loaded / 1048576).toFixed(0) + " / " + (total / 1048576).toFixed(0) + " MB");
        }
    }

    // called by the engine every time its load step or fraction changes
    window.spartan_progress = function (step, fraction)
    {
        if (failed || !step)
            return;

        // each new step takes a share of what is left, so the bar keeps moving without knowing the step count,
        // pipelines are the longest step in the browser and get most of what remains
        const name = step.replace(/\s*\(.*\)$/, "");
        if (name !== engine_step)
        {
            engine_step = name;
            engine_base = Math.max(engine_base, progress) + (0.97 - Math.max(engine_base, progress)) * 0.15;
        }
        const share = name === "Compiling pipelines" ? 0.8 : 0.3;
        const next  = engine_base + (0.97 - engine_base) * share;
        show(fraction >= 0.0 ? engine_base + (next - engine_base) * fraction : engine_base, step);
    };

    // the startup world has no file, only the requested world ends the loading screen
    window.spartan_world_ready = function (path)
    {
        if (!path)
            return;

        show(1.0, "Ready");
        setTimeout(() => loading_element.classList.add("done"), 600);
        if (window.parent !== window)
        {
            window.parent.postMessage("spartan-world-ready", "*");
        }
    };

    if (!navigator.gpu)
    {
        fail("This browser doesn't expose WebGPU, try a recent Chrome or Edge");
    }

    // ?world=worlds/name.world opens another packaged world
    const world = new URLSearchParams(window.location.search).get("world") || "SPARTAN_DEFAULT_WORLD";

    // the page that embeds the engine passes ?v=<build> so a new deploy never pairs a cached spartan.js or spartan.wasm with new data
    const version = new URLSearchParams(window.location.search).get("v");
    const versioned = (path) => version ? path + "?v=" + encodeURIComponent(version) : path;

    var Module =
    {
        locateFile: (path, prefix) => prefix + versioned(path),
        arguments: world ? ["--world", world] : [],
        canvas: document.getElementById("canvas"),
        print: (text) => console.log(text),
        printErr: (text) => console.warn(text),
        setStatus: (text) => set_status(text),
        monitorRunDependencies: (left) => { if (!left) show(download_share, "Starting the engine"); },
        onRuntimeInitialized: () => show(download_share, "Starting the engine"),
        onAbort: (what) => { fail("The engine stopped: " + what); console.error("abort: " + what + "\n" + new Error().stack); },
    };

    window.addEventListener("error", (event) => fail("Error: " + event.message));
    window.addEventListener("unhandledrejection", (event) =>
    {
        const reason = event.reason && event.reason.message ? event.reason.message : String(event.reason);
        fail("The engine stopped: " + reason);
        console.error("unhandled: " + (event.reason && event.reason.stack ? event.reason.stack : event.reason));
    });

    (async () =>
    {
        if (!navigator.gpu)
        {
            fail("This browser doesn't expose WebGPU, try a recent Chrome, Edge or Safari");
            return;
        }

        try
        {
            const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" }) || await navigator.gpu.requestAdapter();
            if (!adapter)
            {
                fail("No WebGPU adapter is available on this device");
                return;
            }

            const wanted = [
                "float32-filterable",
                "float32-blendable",
                "texture-formats-tier1",
                "texture-formats-tier2",
                "unorm16-texture-formats",
                "rg11b10ufloat-renderable",
                "bgra8unorm-storage",
                "depth32float-stencil8",
                "texture-compression-bc",
                "indirect-first-instance",
                "depth-clip-control",
                "dual-source-blending"
            ];
            const requiredFeatures = wanted.filter((feature) => adapter.features && adapter.features.has(feature));
            const requiredLimits   = {};
            if (adapter.limits)
            {
                for (const key in adapter.limits)
                {
                    const value = adapter.limits[key];
                    if (typeof value === "number" && key !== "minSubgroupSize" && key !== "maxSubgroupSize")
                    {
                        requiredLimits[key] = value;
                    }
                }
            }

            let device = null;
            try
            {
                device = await adapter.requestDevice({ requiredFeatures, requiredLimits });
            }
            catch (_)
            {
                device = await adapter.requestDevice({ requiredFeatures });
            }

            device.addEventListener("uncapturederror", (event) =>
            {
                if (event && event.error)
                {
                    console.warn("WebGPU: " + event.error.message);
                }
            });

            // probe whether this browser allows binding depth32float views to unfilterable-float layouts (Safari WebKit rejects it)
            let depthUnfilterableOk = false;
            try
            {
                device.pushErrorScope("validation");
                const probeTex = device.createTexture({ size: [1, 1, 1], format: "depth32float", usage: GPUTextureUsage.TEXTURE_BINDING });
                const probeBgl = device.createBindGroupLayout({ entries: [{ binding: 0, visibility: GPUShaderStage.COMPUTE, texture: { sampleType: "unfilterable-float", viewDimension: "2d" } }] });
                device.createBindGroup({ layout: probeBgl, entries: [{ binding: 0, resource: probeTex.createView({ aspect: "depth-only" }) }] });
                const probeErr = await device.popErrorScope();
                probeTex.destroy();
                depthUnfilterableOk = !probeErr;
            }
            catch (_)
            {
                depthUnfilterableOk = false;
            }

            // Safari WebKit throws synchronous InvalidStateError on recoverable pass/bindgroup validation mismatches instead of returning error objects like Dawn
            if (typeof GPUCommandEncoder !== "undefined" && GPUCommandEncoder.prototype && !GPUCommandEncoder.prototype.__spWrapped)
            {
                GPUCommandEncoder.prototype.__spWrapped = true;
                const origBeginRenderPass = GPUCommandEncoder.prototype.beginRenderPass;
                const noopPass = new Proxy({}, { get: () => () => {} });
                GPUCommandEncoder.prototype.beginRenderPass = function (desc)
                {
                    try
                    {
                        return origBeginRenderPass.call(this, desc);
                    }
                    catch (err)
                    {
                        console.warn("WebGPU beginRenderPass skipped (" + (desc && desc.label ? desc.label : "pass") + "): " + (err && err.message ? err.message : err));
                        return noopPass;
                    }
                };
            }
            if (typeof GPUDevice !== "undefined" && GPUDevice.prototype && !GPUDevice.prototype.__spWrapped)
            {
                GPUDevice.prototype.__spWrapped = true;
                const origCreateBindGroup = GPUDevice.prototype.createBindGroup;
                let fallbackBindGroup = null;
                GPUDevice.prototype.createBindGroup = function (desc)
                {
                    try
                    {
                        return origCreateBindGroup.call(this, desc);
                    }
                    catch (err)
                    {
                        console.warn("WebGPU createBindGroup fallback (" + (desc && desc.label ? desc.label : "group") + "): " + (err && err.message ? err.message : err));
                        if (!fallbackBindGroup)
                        {
                            const emptyLayout = this.createBindGroupLayout({ entries: [] });
                            fallbackBindGroup = origCreateBindGroup.call(this, { layout: emptyLayout, entries: [] });
                        }
                        return fallbackBindGroup;
                    }
                };
                const origSetBindGroup = GPUComputePassEncoder.prototype.setBindGroup;
                GPUComputePassEncoder.prototype.setBindGroup = function ()
                {
                    try { return origSetBindGroup.apply(this, arguments); } catch (_) {}
                };
                const origRenderSetBindGroup = GPURenderPassEncoder.prototype.setBindGroup;
                GPURenderPassEncoder.prototype.setBindGroup = function ()
                {
                    try { return origRenderSetBindGroup.apply(this, arguments); } catch (_) {}
                };
            }

            Module.spartanDepthUnfilterableOk  = depthUnfilterableOk ? 1 : 0;
            Module.preinitializedWebGPUAdapter = adapter;
            Module.preinitializedWebGPUDevice  = device;
        }
        catch (err)
        {
            fail("WebGPU initialization failed: " + (err && err.message ? err.message : String(err)));
            return;
        }

        const script = document.createElement("script");
        script.src   = versioned("spartan.js");
        script.async = true;
        document.body.appendChild(script);
    })();
</script>
<!-- loaded above with the version, emscripten requires the placeholder: {{{ SCRIPT }}} -->
</body>
</html>
