name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'funding.yml'
      - '.gitignore'
      - '.gitattributes'
      - '.github/images/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'funding.yml'
      - '.gitignore'
      - '.gitattributes'
      - '.github/images/**'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  # one stamp shared by every build and the release tag, so the exe version equals the tag
  stamp:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
      tag: ${{ steps.stamp.outputs.tag }}
    steps:
      - id: stamp
        run: |
          read y m d h n <<< "$(date -u +'%Y %m %d %H %M')"
          echo "stamp=$y$m$d$h$n" >> $GITHUB_OUTPUT
          echo "tag=$y.$m.$d.$h.$n" >> $GITHUB_OUTPUT

  build:
    needs: stamp
    strategy:
      matrix:
        include:
          - api: vulkan
            configuration: development
          - api: vulkan
            configuration: release
          - api: vulkan
            configuration: debug
          - api: d3d12
            configuration: release

    # windows-2025 ships visual studio 2026, matching the vs2026 projects premake generates
    runs-on: windows-2025
    env:
      SPARTAN_BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'

      # setup.lua verifies the sha256 and skips the dropbox download when the cached archive matches
      - name: Cache libraries archive
        uses: actions/cache@v4
        with:
          path: third_party/libraries/libraries.7z
          key: libraries-${{ hashFiles('tools/setup.lua') }}

      - name: Generate project files
        shell: cmd
        run: call generate_project_files.bat vs2026 ${{ matrix.api }}

      - name: Build
        shell: cmd
        run: msbuild /p:Platform=x64 /p:Configuration=${{ matrix.configuration }} /m Spartan.slnx

      - name: Create artifact
        if: matrix.configuration == 'release'
        shell: cmd
        run: |
          set ZIP=spartan_${{ matrix.api }}_release.zip
          set EXE=spartan_${{ matrix.api }}.exe
          if exist binaries\steam_appid.txt (
            tar -a -c -f %ZIP% binaries\*.dll binaries\steam_appid.txt binaries\data binaries\%EXE%
          ) else (
            tar -a -c -f %ZIP% binaries\*.dll binaries\data binaries\%EXE%
          )

      - name: Upload artifact
        if: matrix.configuration == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: spartan_${{ matrix.api }}_release
          path: spartan_${{ matrix.api }}_release.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [stamp, build]
    permissions:
      contents: write
    env:
      TAG: ${{ needs.stamp.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: spartan_*_release
          merge-multiple: true
          path: .

      - name: Rename release artifacts
        run: |
          mv spartan_vulkan_release.zip spartan_vulkan_release_$TAG.zip
          mv spartan_d3d12_release.zip spartan_d3d12_release_$TAG.zip

      - name: Generate release notes
        id: generate_release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });

            let commits = [];
            const lastRelease = releases[0];
            if (lastRelease && lastRelease.tag_name) {
              const { data: compareData } = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: lastRelease.tag_name,
                head: context.sha
              });
              commits = compareData.commits || [];
            } else {
              const { data: recentCommits } = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 50
              });
              commits = recentCommits || [];
            }

            const groupOrder = [
              'rhi', 'vulkan', 'd3d12', 'rendering', 'editor',
              'world', 'terrain', 'animation', 'physics', 'other'
            ];
            const groupTitle = {
              rhi: 'RHI',
              vulkan: 'Vulkan',
              d3d12: 'Direct3D 12',
              rendering: 'Rendering',
              editor: 'Editor',
              world: 'World',
              terrain: 'Terrain',
              animation: 'Animation',
              physics: 'Physics',
              other: 'Other'
            };

            const groups = {};
            for (const commit of commits) {
              const first = commit.commit.message.split('\n')[0].trim();
              if (!first || first.startsWith('Merge')) {
                continue;
              }
              const match = first.match(/^([a-z0-9][a-z0-9_-]{0,23}):\s+(.+)$/i);
              const area = match ? match[1].toLowerCase() : 'other';
              const text = match ? match[2] : first;
              const sha = commit.sha.substring(0, 7);
              if (!groups[area]) {
                groups[area] = [];
              }
              groups[area].push(`- [\`${sha}\`](${commit.html_url}) ${text}`);
            }

            const seen = new Set();
            const sections = [];
            for (const area of [...groupOrder, ...Object.keys(groups).sort()]) {
              if (seen.has(area) || !groups[area]) {
                continue;
              }
              seen.add(area);
              const title = groupTitle[area] || area.replace(/[_-]/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
              sections.push(`### ${title}\n${groups[area].join('\n')}`);
            }

            const changelog = sections.length > 0
              ? sections.join('\n\n')
              : '_No new commits since the last release._';

            const notes = [
              'Windows editor builds. Unzip and run `spartan_vulkan.exe` or `spartan_d3d12.exe`.',
              '',
              '| Backend | Artifact |',
              '| --- | --- |',
              '| Vulkan | `spartan_vulkan_release_*.zip` |',
              '| Direct3D 12 | `spartan_d3d12_release_*.zip` |',
              '',
              '## Changelog',
              '',
              changelog
            ].join('\n');

            const fs = require('fs');
            const delimiter = 'EOF_' + Math.random().toString(36).substr(2, 9);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `notes<<${delimiter}\n${notes}\n${delimiter}\n`);

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Spartan v${{ env.TAG }}"
          body: ${{ steps.generate_release_notes.outputs.notes }}
          prerelease: true
          files: |
            spartan_vulkan_release_${{ env.TAG }}.zip
            spartan_d3d12_release_${{ env.TAG }}.zip
