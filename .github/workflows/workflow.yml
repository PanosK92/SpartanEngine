name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'funding.yml'
      - '.gitignore'
      - '.gitattributes'
      - '.github/images'
      - '.github/ISSUE_TEMPLATE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'funding.yml'
      - '.gitignore'
      - '.gitattributes'
      - '.github/images'
      - '.github/ISSUE_TEMPLATE'

jobs:
  build:
    strategy:
      matrix:
        include:
          - api: vulkan
            configuration: development
          - api: vulkan
            configuration: release
          - api: vulkan
            configuration: debug
          - api: d3d12
            configuration: release

    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild / Visual Studio Environment
        uses: microsoft/setup-msbuild@v1
        with:
          vs-version: '[17.0,18.0)'

      - name: Show MSVC version (for debugging)
        shell: cmd
        run: |
          where msbuild
          msbuild /version
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" && cl

      - name: Generate project files
        shell: cmd
        working-directory: ${{ github.workspace }}
        env:
          API: ${{ matrix.api }}
        run: |
          set CHOICE=2
          if "%API%"=="vulkan" set CHOICE=1
          call generate_project_files.bat %CHOICE%
          if errorlevel 1 exit /b 1
          
      - name: Verify solution file exists
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          if not exist Spartan.slnx (
            echo Error: Spartan.slnx not found!
            dir *.sln*
            exit /b 1
          )
          echo Solution file found: Spartan.slnx
          
      - name: Build
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: msbuild /p:Platform=x64 /p:Configuration=${{ matrix.configuration }} /p:PlatformToolset=v143 /m Spartan.slnx

      - name: Create artifacts
        if: github.event_name != 'pull_request' && matrix.configuration == 'release'
        shell: cmd
        run: |
          echo "Creating artifacts for ${{ matrix.api }} - ${{ matrix.configuration }}"
          set ZIP=spartan_${{ matrix.api }}_${{ matrix.configuration }}.zip
          set EXE=spartan_${{ matrix.api }}.exe
          echo DLLs in binaries:
          dir /b binaries\*.dll
          if exist binaries\steam_appid.txt (
            tar -a -c -f %ZIP% binaries\*.dll binaries\steam_appid.txt binaries\data binaries\%EXE%
          ) else (
            tar -a -c -f %ZIP% binaries\*.dll binaries\data binaries\%EXE%
          )
          echo "Artifact creation completed for ${{ matrix.api }} - ${{ matrix.configuration }}"

      - name: Upload artifact
        if: github.event_name != 'pull_request' && matrix.configuration == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: spartan_${{ matrix.api }}_${{ matrix.configuration }}
          path: spartan_${{ matrix.api }}_${{ matrix.configuration }}.zip

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download vulkan release build
        uses: actions/download-artifact@v4
        with:
          name: spartan_vulkan_release
          path: .

      - name: Download d3d12 release build
        uses: actions/download-artifact@v4
        with:
          name: spartan_d3d12_release
          path: .

      - name: Get date and time for versioning
        id: get_datetime
        run: echo "version=$(date +'%Y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Rename release artifacts
        run: |
          mv spartan_vulkan_release.zip spartan_vulkan_release_${{ steps.get_datetime.outputs.version }}.zip
          mv spartan_d3d12_release.zip spartan_d3d12_release_${{ steps.get_datetime.outputs.version }}.zip

      - name: Generate release notes
        id: generate_release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });

            let commits = [];
            const lastRelease = releases[0];
            if (lastRelease && lastRelease.tag_name) {
              const { data: compareData } = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: lastRelease.tag_name,
                head: context.sha
              });
              commits = compareData.commits || [];
            } else {
              const { data: recentCommits } = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 50
              });
              commits = recentCommits || [];
            }

            const groupOrder = [
              'rhi', 'vulkan', 'd3d12', 'rendering', 'editor',
              'world', 'terrain', 'animation', 'physics', 'other'
            ];
            const groupTitle = {
              rhi: 'RHI',
              vulkan: 'Vulkan',
              d3d12: 'Direct3D 12',
              rendering: 'Rendering',
              editor: 'Editor',
              world: 'World',
              terrain: 'Terrain',
              animation: 'Animation',
              physics: 'Physics',
              other: 'Other'
            };

            const groups = {};
            for (const commit of commits) {
              const first = commit.commit.message.split('\n')[0].trim();
              if (!first || first.startsWith('Merge')) {
                continue;
              }
              const match = first.match(/^([a-z0-9][a-z0-9_-]{0,23}):\s+(.+)$/i);
              const area = match ? match[1].toLowerCase() : 'other';
              const text = match ? match[2] : first;
              const sha = commit.sha.substring(0, 7);
              if (!groups[area]) {
                groups[area] = [];
              }
              groups[area].push(`- [\`${sha}\`](${commit.html_url}) ${text}`);
            }

            const seen = new Set();
            const sections = [];
            for (const area of [...groupOrder, ...Object.keys(groups).sort()]) {
              if (seen.has(area) || !groups[area]) {
                continue;
              }
              seen.add(area);
              const title = groupTitle[area] || area.replace(/[_-]/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
              sections.push(`### ${title}\n${groups[area].join('\n')}`);
            }

            const changelog = sections.length > 0
              ? sections.join('\n\n')
              : '_No new commits since the last release._';

            const notes = [
              'Windows editor builds. Unzip and run `spartan_vulkan.exe` or `spartan_d3d12.exe`.',
              '',
              '| Backend | Artifact |',
              '| --- | --- |',
              '| Vulkan | `spartan_vulkan_release_*.zip` |',
              '| Direct3D 12 | `spartan_d3d12_release_*.zip` |',
              '',
              '## Changelog',
              '',
              changelog
            ].join('\n');

            const fs = require('fs');
            const delimiter = 'EOF_' + Math.random().toString(36).substr(2, 9);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `notes<<${delimiter}\n${notes}\n${delimiter}\n`);

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_datetime.outputs.version }}
          name: "Spartan v${{ steps.get_datetime.outputs.version }}"
          body: ${{ steps.generate_release_notes.outputs.notes }}
          prerelease: true
          files: |
            spartan_vulkan_release_${{ steps.get_datetime.outputs.version }}.zip
            spartan_d3d12_release_${{ steps.get_datetime.outputs.version }}.zip
