name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'funding.yml'
      - '.gitignore'
      - '.gitattributes'
      - '.github/images/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'funding.yml'
      - '.gitignore'
      - '.gitattributes'
      - '.github/images/**'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  # one stamp shared by every build and the release tag, so the exe version equals the tag
  stamp:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
      tag: ${{ steps.stamp.outputs.tag }}
    steps:
      - id: stamp
        run: |
          read y m d h n <<< "$(date -u +'%Y %m %d %H %M')"
          echo "stamp=$y$m$d$h$n" >> $GITHUB_OUTPUT
          echo "tag=$y.$m.$d.$h.$n" >> $GITHUB_OUTPUT

  build:
    name: windows ${{ matrix.api }} release
    needs: stamp
    strategy:
      fail-fast: false
      matrix:
        api: [d3d12, vulkan]

    # windows-2025 ships visual studio 2026, matching the vs2026 projects premake generates
    runs-on: windows-2025
    env:
      SPARTAN_BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'

      # setup.lua verifies the sha256 and skips the dropbox download when the cached archive matches
      - name: Cache libraries archive
        uses: actions/cache@v4
        with:
          path: third_party/libraries/libraries.7z
          key: libraries-${{ hashFiles('tools/setup.lua') }}

      - name: Generate project files
        shell: cmd
        run: call generate_project_files.bat vs2026 ${{ matrix.api }}

      - name: Build
        shell: cmd
        run: msbuild /p:Platform=x64 /p:Configuration=release /m spartan.slnx

      - name: Startup smoke test (no GPU)
        id: smoke
        timeout-minutes: 3
        run: python tools/ci_smoke_test.py binaries/spartan_${{ matrix.api }}.exe

      - name: Upload startup failure diagnostics
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-windows-${{ matrix.api }}
          path: |
            binaries/logs/log.txt
            binaries/logs/smoke_test_*.txt
          retention-days: 14

      - name: Create artifact
        shell: cmd
        run: |
          set ZIP=spartan_windows_${{ matrix.api }}.zip
          set EXE=spartan_${{ matrix.api }}.exe
          if exist binaries\steam_appid.txt (
            tar -a -c -f %ZIP% binaries\third_party binaries\steam_appid.txt binaries\data binaries\%EXE%
          ) else (
            tar -a -c -f %ZIP% binaries\third_party binaries\data binaries\%EXE%
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spartan_windows_${{ matrix.api }}
          path: spartan_windows_${{ matrix.api }}.zip

  # webgpu ships twice: a native windows build on dawn and the browser package
  # the browser can't compile hlsl, so the native build first fills the wgsl cache on warp (no gpu on the runner)
  build_webgpu:
    name: windows webgpu and web release
    needs: stamp
    runs-on: windows-2025
    env:
      SPARTAN_BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
      EMSDK_VERSION: 7.0.0
      SPARTAN_WEB_DEPS: ${{ github.workspace }}\..\spartan_web_deps
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'

      # setup.lua verifies the sha256 of both archives and skips the downloads when the cached copies match
      - name: Cache libraries and dawn archives
        uses: actions/cache@v4
        with:
          path: |
            third_party/libraries/libraries.7z
            third_party/libraries/dawn_windows.tar.gz
          key: libraries-webgpu-${{ hashFiles('tools/setup.lua') }}

      - name: Generate project files
        shell: cmd
        run: call generate_project_files.bat vs2026 webgpu

      - name: Build
        shell: cmd
        run: msbuild /p:Platform=x64 /p:Configuration=release /m spartan.slnx

      - name: Startup smoke test (no GPU)
        id: smoke
        timeout-minutes: 3
        run: python tools/ci_smoke_test.py binaries/spartan_webgpu.exe

      - name: Upload startup failure diagnostics
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-windows-webgpu
          path: |
            binaries/logs/log.txt
            binaries/logs/smoke_test_*.txt
          retention-days: 14

      # tint.exe compiles the shaders at runtime, it has to ship next to the executable
      - name: Create native artifact
        shell: cmd
        run: |
          if exist binaries\steam_appid.txt (
            tar -a -c -f spartan_windows_webgpu.zip binaries\third_party binaries\steam_appid.txt binaries\data binaries\tint.exe binaries\spartan_webgpu.exe
          ) else (
            tar -a -c -f spartan_windows_webgpu.zip binaries\third_party binaries\data binaries\tint.exe binaries\spartan_webgpu.exe
          )

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: spartan_windows_webgpu
          path: spartan_windows_webgpu.zip

      # --bake-shaders compiles every shader the renderer creates on warp and exits without rendering a frame
      - name: Bake WebGPU shaders on WARP
        id: bake
        timeout-minutes: 25
        run: |
          $process = Start-Process binaries\spartan_webgpu.exe -ArgumentList "--software-gpu", "--bake-shaders", "--no-steam" -WorkingDirectory binaries -PassThru
          $finished = $process.WaitForExit(20 * 60 * 1000)
          if (-not $finished) {
            $process.Kill()
          }
          $count = (Get-ChildItem binaries\cache\generated_cache\webgpu_shaders -File -ErrorAction SilentlyContinue | Measure-Object).Count
          echo "baked $count shaders (finished: $finished)"
          if (-not $finished -or $count -lt 100) {
            Get-Content binaries\logs\log_headless.txt -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Upload bake diagnostics
        if: ${{ failure() && steps.bake.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: shader-bake-windows-webgpu
          path: binaries/logs/*.txt
          retention-days: 14

      - name: Cache emsdk
        id: emsdk_cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install emsdk
        if: steps.emsdk_cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$env:USERPROFILE\emsdk"
          & "$env:USERPROFILE\emsdk\emsdk.bat" install $env:EMSDK_VERSION
          & "$env:USERPROFILE\emsdk\emsdk.bat" activate $env:EMSDK_VERSION

      # physx, assimp, lua and freeimage sources, the libraries themselves rebuild with the engine
      - name: Cache web dependency sources
        uses: actions/cache@v4
        with:
          path: ${{ env.SPARTAN_WEB_DEPS }}
          key: web-deps-${{ hashFiles('tools/web_build.py') }}

      - name: Build web
        run: |
          python -m pip install ninja
          python tools/web_build.py engine

      - name: Create web artifact
        shell: cmd
        run: tar -a -c -f spartan_web_webgpu.zip -C binaries\web spartan.html spartan.js spartan.wasm spartan.data serve.py

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: spartan_web_webgpu
          path: spartan_web_webgpu.zip

  build_linux:
    name: linux vulkan release
    needs: stamp
    runs-on: ubuntu-24.04
    env:
      SPARTAN_BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 cmake ninja-build pkg-config curl python3 \
            libvulkan-dev libfreeimage-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev

      # the script skips finished libraries and marks new ones in .changed, so partial progress is saved even when a later library fails
      - name: Restore libraries
        uses: actions/cache/restore@v4
        with:
          path: third_party/libraries/linux
          key: libraries-linux-${{ hashFiles('tools/linux_dependencies.sh') }}-${{ github.run_id }}
          restore-keys: |
            libraries-linux-${{ hashFiles('tools/linux_dependencies.sh') }}-
            libraries-linux-

      - name: Build libraries
        run: |
          set -o pipefail
          rm -f third_party/libraries/linux/.changed
          bash tools/linux_dependencies.sh 2>&1 | tee dependencies.log

      - name: Save libraries
        if: always() && hashFiles('third_party/libraries/linux/.changed') != ''
        uses: actions/cache/save@v4
        with:
          path: third_party/libraries/linux
          key: libraries-linux-${{ hashFiles('tools/linux_dependencies.sh') }}-${{ github.run_id }}

      - name: Install premake
        run: |
          curl -fsSL https://github.com/premake/premake-core/releases/download/v5.0.0-beta7/premake-5.0.0-beta7-linux.tar.gz | tar -xz -C tools
          chmod +x tools/premake5

      - name: Generate project files
        run: bash generate_project_files.sh gmake vulkan

      - name: Build
        run: |
          set -o pipefail
          make -k config=release_x64 -j$(nproc) 2>&1 | tee build.log

      # job logs need a signed in user, annotations are public, so surface the errors there
      - name: Report errors
        if: failure()
        run: |
          cat dependencies.log build.log 2>/dev/null | sed "s|$GITHUB_WORKSPACE/||g" | cut -c1-300 > report.log || true
          {
            grep -E "error:|Error [0-9]+|undefined reference|CMake Error|No such file|not found" report.log | cut -c1-220 | awk '!seen[$0]++' | head -150 || true
            echo "---- log tail"
            tail -20 report.log
          } > summary.log
          # annotations are cut at roughly 4 KB each
          split -b 3500 -d summary.log chunk_
          for chunk in $(ls chunk_* | head -9); do
            echo "::error title=linux build $chunk::$(sed -e ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$chunk")"
          done

      - name: Startup smoke test (no GPU)
        id: smoke
        timeout-minutes: 3
        run: python3 tools/ci_smoke_test.py binaries/spartan_vulkan

      - name: Upload startup failure diagnostics
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-linux-vulkan
          path: |
            binaries/logs/log.txt
            binaries/logs/smoke_test_*.txt
          retention-days: 14

      - name: Create artifact
        run: tar -czf spartan_linux_vulkan.tar.gz -C binaries spartan_vulkan libdxcompiler.so libdxil.so data

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spartan_linux_vulkan
          path: spartan_linux_vulkan.tar.gz

  build_macos:
    name: macos metal release
    needs: stamp
    # metal 4 needs macos 26 and xcode 26
    runs-on: macos-26
    env:
      SPARTAN_BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
      # apple only serves the metal shader converter behind a developer sign in, so the installer is mirrored as a release asset
      METAL_SHADER_CONVERTER_URL: https://github.com/${{ github.repository }}/releases/download/dependencies/metal_shader_converter_macos.pkg
      METAL_SHADER_CONVERTER_SHA256: 449833211e4ef0d46bfaa94848e801acff49e226d3c348bba0673f13716be622
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install packages
        run: brew install cmake ninja freeimage

      - name: Install Metal Shader Converter
        run: |
          curl -fsSL -o metal_shader_converter.pkg "$METAL_SHADER_CONVERTER_URL"
          echo "$METAL_SHADER_CONVERTER_SHA256  metal_shader_converter.pkg" | shasum -a 256 -c -
          sudo installer -pkg metal_shader_converter.pkg -target /
          test -f /usr/local/lib/libmetalirconverter.dylib

      # the script skips finished libraries, so partial progress is saved even when a later library fails
      - name: Restore libraries
        uses: actions/cache/restore@v4
        with:
          path: third_party/libraries/macos
          key: libraries-macos-${{ hashFiles('tools/macos_dependencies.sh') }}-${{ github.run_id }}
          restore-keys: |
            libraries-macos-${{ hashFiles('tools/macos_dependencies.sh') }}-
            libraries-macos-

      # each finished library leaves a .done_<name> marker, the cache is only saved when a new one appears
      - name: Build libraries
        id: libraries
        run: |
          count_done() { ls third_party/libraries/macos/.done_* 2>/dev/null | wc -l; }
          before=$(count_done)
          set +e
          bash tools/macos_dependencies.sh 2>&1 | tee dependencies.log
          status=${PIPESTATUS[0]}
          if [ "$(count_done)" -gt "$before" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          exit $status

      - name: Save libraries
        if: always() && steps.libraries.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/libraries/macos
          key: libraries-macos-${{ hashFiles('tools/macos_dependencies.sh') }}-${{ github.run_id }}

      - name: Generate project files
        run: bash generate_project_files.sh xcode4 metal

      - name: Build
        run: |
          set -o pipefail
          configuration=$(xcodebuild -list -json -project spartan.xcodeproj | python3 -c "import json, sys; print(next(c for c in json.load(sys.stdin)['project']['configurations'] if c.lower().startswith('release')))")
          xcodebuild -project spartan.xcodeproj -configuration "$configuration" -arch arm64 CODE_SIGN_IDENTITY=- build 2>&1 | tee build.log
          test -x binaries/spartan_metal

      # job logs need a signed in user, annotations are public, so surface the errors there
      - name: Report errors
        if: failure()
        run: |
          cat dependencies.log build.log 2>/dev/null | sed "s|$GITHUB_WORKSPACE/||g" | cut -c1-300 > report.log || true
          {
            grep -E "error:|Error [0-9]+|Undefined symbols|CMake Error|No such file|not found|BUILD FAILED" report.log | cut -c1-220 | awk '!seen[$0]++' | head -150 || true
            echo "---- log tail"
            tail -20 report.log
          } > summary.log
          # annotations are cut at roughly 4 KB each
          split -b 3500 -d summary.log chunk_
          for chunk in $(ls chunk_* | head -9); do
            echo "::error title=macos build $chunk::$(sed -e ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$chunk")"
          done

      - name: Startup smoke test (no GPU)
        id: smoke
        timeout-minutes: 3
        run: python3 tools/ci_smoke_test.py binaries/spartan_metal

      - name: Upload startup failure diagnostics
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-macos-metal
          path: |
            binaries/logs/log.txt
            binaries/logs/smoke_test_*.txt
          retention-days: 14

      # freeimage comes from homebrew and the shader converter from /usr/local, they ship next to the executable instead
      - name: Bundle runtime libraries
        run: |
          cd binaries
          for library in $(otool -L spartan_metal | awk 'NR > 1 && $1 ~ "^/(opt|usr/local)/" { print $1 }'); do
            name=$(basename "$library")
            [ -f "$name" ] || cp -L "$library" "$name"
            chmod u+w "$name"
            install_name_tool -id "@rpath/$name" "$name"
            install_name_tool -change "$library" "@rpath/$name" spartan_metal
          done
          for binary in spartan_metal *.dylib; do
            codesign --force --sign - "$binary"
          done
          # anything outside the system or next to the executable would be missing on a user's machine
          if otool -L spartan_metal *.dylib | grep -E '^\s+/(opt|usr/local)/'; then
            echo "::error title=macos bundle::non system libraries are still referenced by absolute path"
            exit 1
          fi

      - name: Create artifact
        run: tar -czf spartan_macos_metal.tar.gz -C binaries spartan_metal $(cd binaries && ls *.dylib) data

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spartan_macos_metal
          path: spartan_macos_metal.tar.gz

  release:
    # every platform must build and pass startup before any release is published
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.build.result == 'success' && needs.build_linux.result == 'success' && needs.build_macos.result == 'success' && needs.build_webgpu.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [stamp, build, build_webgpu, build_linux, build_macos]
    permissions:
      contents: write
    env:
      TAG: ${{ needs.stamp.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: spartan_*
          merge-multiple: true
          path: .

      # spartan_<platform>_<api>.<ext> becomes spartan_<platform>_<api>_<tag>.<ext>
      - name: Rename release artifacts
        run: |
          for file in spartan_*.zip spartan_*.tar.gz; do
            mv "$file" "${file%%.*}_$TAG.${file#*.}"
          done
          ls -l spartan_*

      - name: Generate release notes
        id: generate_release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10
            });

            let commits = [];
            // the dependencies release only mirrors build inputs, it is not an engine build
            const lastRelease = releases.find((release) => release.tag_name !== 'dependencies');
            if (lastRelease && lastRelease.tag_name) {
              const { data: compareData } = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: lastRelease.tag_name,
                head: context.sha
              });
              commits = compareData.commits || [];
            } else {
              const { data: recentCommits } = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 50
              });
              commits = recentCommits || [];
            }

            const groupOrder = [
              'rhi', 'vulkan', 'd3d12', 'metal', 'webgpu', 'platforms', 'rendering', 'editor',
              'world', 'terrain', 'animation', 'physics', 'other'
            ];
            const groupTitle = {
              rhi: 'RHI',
              vulkan: 'Vulkan',
              d3d12: 'Direct3D 12',
              metal: 'Metal',
              webgpu: 'WebGPU',
              platforms: 'Platforms',
              rendering: 'Rendering',
              editor: 'Editor',
              world: 'World',
              terrain: 'Terrain',
              animation: 'Animation',
              physics: 'Physics',
              other: 'Other'
            };

            const groups = {};
            for (const commit of commits) {
              const first = commit.commit.message.split('\n')[0].trim();
              if (!first || first.startsWith('Merge')) {
                continue;
              }
              const match = first.match(/^([a-z0-9][a-z0-9_-]{0,23}):\s+(.+)$/i);
              const area = match ? match[1].toLowerCase() : 'other';
              const text = match ? match[2] : first;
              const sha = commit.sha.substring(0, 7);
              if (!groups[area]) {
                groups[area] = [];
              }
              groups[area].push(`- ${text} <sub>[\`${sha}\`](${commit.html_url})</sub>`);
            }

            const seen = new Set();
            const sections = [];
            for (const area of [...groupOrder, ...Object.keys(groups).sort()]) {
              if (seen.has(area) || !groups[area]) {
                continue;
              }
              seen.add(area);
              const title = groupTitle[area] || area.replace(/[_-]/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
              sections.push(`### ${title} <sub>${groups[area].length}</sub>\n\n${groups[area].join('\n')}`);
            }

            const fs = require('fs');
            const crypto = require('crypto');
            const tag = process.env.TAG;
            const repo_url = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const images_url = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.sha}/.github/images`;
            const icon = (name) => `<img src="${images_url}/platforms/${name}.svg" width="16" height="16" alt=""/>`;
            const previous_tag = lastRelease ? lastRelease.tag_name : null;

            const downloads = [
              { os: 'windows', os_name: 'Windows', api: 'vulkan', api_name: 'Vulkan', name: 'spartan_windows_vulkan', ext: 'zip', notes: '**Recommended**' },
              { os: 'windows', os_name: 'Windows', api: 'directx', api_name: 'DirectX&nbsp;12', name: 'spartan_windows_d3d12', ext: 'zip', notes: '' },
              { os: 'linux', os_name: 'Linux', api: 'vulkan', api_name: 'Vulkan', name: 'spartan_linux_vulkan', ext: 'tar.gz', notes: 'x64' },
              { os: 'apple', os_name: 'macOS', api: 'metal', api_name: 'Metal', name: 'spartan_macos_metal', ext: 'tar.gz', notes: 'macOS 26+, Apple&nbsp;silicon' },
              { os: 'windows', os_name: 'Windows', api: 'webgpu', api_name: 'WebGPU', name: 'spartan_windows_webgpu', ext: 'zip', notes: '_Work in progress_' },
              { os: 'web', os_name: 'Browser', api: 'webgpu', api_name: 'WebGPU', name: 'spartan_web_webgpu', ext: 'zip', notes: '_Work in progress_' }
            ];

            const sha256 = (file) => new Promise((resolve, reject) => {
              const hash = crypto.createHash('sha256');
              fs.createReadStream(file).on('data', (data) => hash.update(data)).on('end', () => resolve(hash.digest('hex'))).on('error', reject);
            });

            const rows = [];
            const checksums = [];
            for (const download of downloads) {
              const file = `${download.name}_${tag}.${download.ext}`;
              const size = `${Math.max(1, Math.round(fs.statSync(file).size / (1024 * 1024)))} MB`;
              const url = `${repo_url}/releases/download/${tag}/${file}`;
              rows.push(`| ${icon(download.os)} | **${download.os_name}** | ${icon(download.api)} | ${download.api_name} | [**${download.name}**.${download.ext}](${url}) | ${size} | ${download.notes} |`);
              checksums.push(`${await sha256(file)}  ${file}`);
            }

            // the tag is yyyy.mm.dd.hh.mm in utc
            const [year, month, day, hour, minute] = tag.split('.');
            const month_name = new Date(Date.UTC(year, month - 1, 1)).toLocaleString('en-US', { month: 'long', timeZone: 'UTC' });
            const short_sha = context.sha.substring(0, 7);
            const commit_count = Object.values(groups).reduce((total, entries) => total + entries.length, 0);
            const since = previous_tag
              ? ` · ${commit_count} ${commit_count === 1 ? 'commit' : 'commits'} since <a href="${repo_url}/releases/tag/${previous_tag}">${previous_tag}</a>`
              : '';

            const changelog = sections.length > 0
              ? sections.join('\n\n')
              : '_No new commits since the last release._';

            const notes = [
              '<p align="center">',
              `  <img src="${images_url}/logo256.png" width="88" alt="Spartan"/>`,
              '</p>',
              '<p align="center">',
              `  Automated editor build of <a href="${repo_url}/commit/${context.sha}"><code>${short_sha}</code></a> · ${Number(day)} ${month_name} ${year}, ${hour}:${minute} UTC${since}`,
              '</p>',
              '',
              '## Download',
              '',
              '| | Platform | | Graphics API | File | Size | Notes |',
              '| :-: | :-- | :-: | :-- | :-- | --: | :-- |',
              ...rows,
              '',
              '> [!TIP]',
              '> Not sure which one to pick? On Windows take **Vulkan**. On first launch the World Launcher downloads the project assets and worlds, so the first start needs an internet connection.',
              '',
              '## Getting started',
              '',
              `<details><summary>${icon('windows')}&nbsp; <b>Windows</b> &nbsp;<sub>Vulkan, DirectX 12, WebGPU</sub></summary>`,
              '',
              '1. Unzip the archive anywhere.',
              '2. Open the `binaries` folder and run `spartan_vulkan.exe`, `spartan_d3d12.exe` or `spartan_webgpu.exe`.',
              '',
              '</details>',
              '',
              `<details><summary>${icon('linux')}&nbsp; <b>Linux</b> &nbsp;<sub>Vulkan</sub></summary>`,
              '',
              '1. Install `libfreeimage3` and a Vulkan driver.',
              '2. Extract and run it:',
              '',
              '```bash',
              `mkdir spartan && tar -xzf spartan_linux_vulkan_${tag}.tar.gz -C spartan`,
              'cd spartan && ./spartan_vulkan',
              '```',
              '',
              '</details>',
              '',
              `<details><summary>${icon('apple')}&nbsp; <b>macOS</b> &nbsp;<sub>Metal, macOS 26+, Apple silicon</sub></summary>`,
              '',
              'The build is not notarized, so clear the quarantine flag before the first run:',
              '',
              '```bash',
              `mkdir spartan && tar -xzf spartan_macos_metal_${tag}.tar.gz -C spartan`,
              'cd spartan && xattr -dr com.apple.quarantine . && ./spartan_metal',
              '```',
              '',
              '</details>',
              '',
              `<details><summary>${icon('web')}&nbsp; <b>Browser</b> &nbsp;<sub>WebGPU, work in progress</sub></summary>`,
              '',
              '1. Unzip the archive and run `python serve.py` in that folder.',
              '2. Open the printed address in Chrome, Edge or Brave.',
              '',
              `The web package boots the editor with an empty world. See [docs/webgpu.md](${repo_url}/blob/master/docs/webgpu.md) to package a world.`,
              '',
              '</details>',
              '',
              "## What's changed",
              '',
              changelog,
              '',
              ...(previous_tag ? [`**Full changelog:** [${previous_tag}...${tag}](${repo_url}/compare/${previous_tag}...${tag})`, ''] : []),
              '<details><summary>SHA-256 checksums</summary>',
              '',
              '```',
              ...checksums,
              '```',
              '',
              '</details>'
            ].join('\n');

            const delimiter = 'EOF_' + Math.random().toString(36).substr(2, 9);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `notes<<${delimiter}\n${notes}\n${delimiter}\n`);

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Spartan v${{ env.TAG }}"
          body: ${{ steps.generate_release_notes.outputs.notes }}
          prerelease: true
          files: |
            spartan_windows_vulkan_${{ env.TAG }}.zip
            spartan_windows_d3d12_${{ env.TAG }}.zip
            spartan_linux_vulkan_${{ env.TAG }}.tar.gz
            spartan_macos_metal_${{ env.TAG }}.tar.gz
            spartan_windows_webgpu_${{ env.TAG }}.zip
            spartan_web_webgpu_${{ env.TAG }}.zip
